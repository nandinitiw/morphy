# Managed Postgres so user-ingested games, weakness profiles and (future)
# spaced-repetition drill schedules survive restarts and deploys. The free
# Postgres plan is real but EXPIRES ~30 days after creation — upgrade the
# database plan before then to keep the data. The app also runs fine on
# SQLite locally (the default when DATABASE_URL is unset).
databases:
  - name: morphy-db
    plan: free
    databaseName: morphy
    postgresMajorVersion: "16"

services:
  - type: web
    name: morphy-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Wired to the managed Postgres above; Render injects its connection
      # string here. db/database.py normalizes the postgres:// scheme and
      # enables pool_pre_ping so idle-dropped connections don't crash queries.
      - key: DATABASE_URL
        fromDatabase:
          name: morphy-db
          property: connectionString
      # Free tier is ~0.1 CPU / 512 MB and restarts under sustained load, which
      # kills long analysis jobs mid-run. Keep each job short enough to finish:
      #   - shallower search (depth 15 -> 12) roughly halves per-game time
      #   - cap the Stockfish loop to the 20 most-recent games
      # Raise/remove both on a paid instance for deeper, fuller analysis.
      - key: ANALYSIS_DEPTH
        value: "12"
      - key: MAX_ANALYZE_GAMES
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
